<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | AARK International School</title><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/png" href="assets/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="assets/css/tokens.css"><style>
/* ---- Dashboard: same palette, type and controls as the sign-in screen ---- */
body{background:var(--v2-paper-100);font-family:var(--v2-font-body);color:var(--v2-ink-900)}
.admin-shell{display:none;min-height:100vh;grid-template-columns:248px minmax(0,1fr);background:linear-gradient(to right,var(--v2-ink-900) 248px,var(--v2-paper-100) 248px)}
.admin-shell.is-active{display:grid}
.admin-sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--v2-ink-900);color:#fff;padding:24px 14px 16px;display:flex;flex-direction:column;gap:4px}
.admin-brand{display:block;padding:4px 8px 6px}
.admin-brand img{display:block;width:100%;max-width:190px;height:auto}
.admin-brand-tag{margin:0 8px 18px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.12);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--v2-gold-500)}
.admin-nav{display:grid;gap:2px}
.admin-nav-label{margin:14px 10px 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--v2-color-text-on-dark-muted)}
.admin-nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;text-align:left;background:none;border:0;border-radius:12px;color:rgba(255,255,255,.78);padding:10px 12px;font:inherit;font-weight:500;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
.admin-nav button svg,.admin-logout svg{flex:0 0 18px;width:18px;height:18px}
.admin-nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.admin-nav button.active{background:rgba(250,200,3,.12);color:#fff;font-weight:600}
.admin-nav button.active::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--v2-gold-500)}
.admin-nav button.active svg{color:var(--v2-gold-500)}
.admin-logout{display:flex;align-items:center;gap:12px;margin-top:auto;min-height:44px;padding:10px 12px;border:0;border-top:1px solid rgba(255,255,255,.12);border-radius:0;background:none;color:#f3b3b3;font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.admin-logout:hover{color:#fff}
.admin-nav button:focus-visible,.admin-logout:focus-visible,.admin-brand:focus-visible{outline:3px solid var(--v2-gold-500);outline-offset:2px}
.admin-main{width:100%;max-width:1120px;padding:28px clamp(18px,4vw,48px) 56px}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px;padding-bottom:16px;border-bottom:1px solid var(--v2-line);font-size:13px;color:var(--v2-ink-500)}
.admin-topbar a{color:var(--v2-brand-500);font-weight:600;text-decoration:none}
.admin-topbar a:hover{text-decoration:underline}
.panel>h2{font-family:var(--v2-font-display);font-weight:600;font-size:clamp(28px,3vw,36px);line-height:1.1;letter-spacing:-.01em;margin:0 0 6px;color:var(--v2-ink-900)}
.hint{color:var(--v2-ink-500);font-size:14px}
.enq-msg{margin-top:6px;font-size:14px}.enq-msg summary{cursor:pointer;color:var(--v2-brand-500);font-weight:600}.enq-msg p{margin:6px 0 0;white-space:pre-wrap;max-width:46ch;color:var(--v2-ink-700)}
.panel>p.hint{margin:0 0 24px;max-width:62ch;line-height:1.55}
.admin-form{display:grid;gap:20px;padding:26px 24px 22px;background:#fff;border:1px solid var(--v2-line);border-radius:22px;margin-bottom:30px;box-shadow:0 10px 30px rgba(24,32,51,.05)}
.admin-form label{display:grid;gap:7px;font-weight:600;font-size:13px;color:var(--v2-brand-700)}
.admin-form input,.admin-form textarea,.enq-toolbar input,.enq-table select{border:1.5px solid #d9cfe2;border-radius:14px;background:#fff;padding:12px 14px;font:inherit;font-size:15px;font-weight:400;color:var(--v2-ink-900);width:100%;transition:border-color .15s,box-shadow .15s}
.admin-form input:focus,.admin-form textarea:focus,.enq-toolbar input:focus,.enq-table select:focus{outline:0;border-color:var(--v2-brand-500);box-shadow:0 0 0 4px rgba(79,37,109,.12)}
.admin-form input::placeholder,.admin-form textarea::placeholder{color:#9a98a8}
.admin-form textarea{min-height:96px;resize:vertical;line-height:1.5}
.admin-form input[type=file]{padding:10px;border-style:dashed;background:var(--v2-paper-50);font-size:14px;cursor:pointer}
.admin-form input[type=file]::file-selector-button{margin-right:12px;border:0;border-radius:999px;background:var(--v2-paper-200);color:var(--v2-brand-700);padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.admin-form .checkline{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--v2-ink-700)}
.admin-form .checkline input{width:20px;height:20px;padding:0;accent-color:var(--v2-brand-500)}
.admin-form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.admin-btn{display:inline-flex;align-items:center;justify-content:center;justify-self:start;min-height:46px;border:0;border-radius:999px;padding:11px 24px;background:var(--v2-gold-500);color:var(--v2-ink-900);font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;box-shadow:0 8px 20px rgba(250,200,3,.24);transition:transform .15s,box-shadow .15s}
.admin-btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(250,200,3,.34)}
.admin-btn:disabled{opacity:.6;cursor:wait;transform:none}
.admin-btn.secondary{background:#fff;color:var(--v2-brand-500);border:1.5px solid #d9cfe2;box-shadow:none}
.admin-btn.secondary:hover{border-color:var(--v2-brand-500);background:var(--v2-paper-50)}
.admin-btn:focus-visible,.small-btn:focus-visible,.admin-item .actions button:focus-visible{outline:3px solid var(--v2-brand-500);outline-offset:2px}
.admin-status{font-size:13px;font-weight:600;color:var(--v2-ink-500)}
.admin-status.ok{color:#1c7a45}
.admin-status.err{color:#b23b3b}
.admin-list{display:grid;gap:12px}
.admin-item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;border:1px solid var(--v2-line);border-radius:18px;background:#fff;transition:border-color .15s,box-shadow .15s}
.admin-item:hover{border-color:#d9cfe2;box-shadow:0 8px 22px rgba(24,32,51,.06)}
.admin-item img,.admin-item .noimg{width:64px;height:64px;object-fit:cover;border-radius:16px 16px 10px 10px;background:var(--v2-paper-200)}
.admin-item .noimg{background:linear-gradient(160deg,var(--v2-paper-200),#e6dcee);box-shadow:inset 0 -4px 0 var(--v2-gold-500)}
.admin-item h3{font-family:var(--v2-font-display);display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;margin:0 0 3px;font-size:16px;font-weight:600;color:var(--v2-ink-900)}
.admin-item p{margin:0;color:var(--v2-ink-500);font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.admin-item .actions{display:flex;gap:8px}
.admin-item .actions button,.small-btn{min-height:36px;border:1.5px solid #d9cfe2;background:#fff;color:var(--v2-brand-500);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.admin-item .actions button:hover,.small-btn:hover{border-color:var(--v2-brand-500);background:var(--v2-paper-50)}
.admin-item .actions button[data-delete]{color:#b23b3b;border-color:#f0cccc}
.admin-item .actions button[data-delete]:hover{border-color:#b23b3b;background:#fff7f7}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;margin-left:8px;white-space:nowrap}
.pill.on{background:#e1f4e7;color:#1c7a45}
.pill.off{background:var(--v2-paper-200);color:var(--v2-ink-500)}
.pill.warn{background:#fdecec;color:#b23b3b}
.enq-toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.enq-toolbar label{display:grid;gap:6px;font-weight:600;font-size:13px;color:var(--v2-brand-700)}
.enq-toolbar input{width:auto;min-height:46px;padding:9px 14px}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--v2-line);border-radius:20px;box-shadow:0 10px 30px rgba(24,32,51,.05)}
.enq-table{width:100%;min-width:720px;border-collapse:collapse;font-size:14px}
.enq-table th,.enq-table td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--v2-line);vertical-align:top;line-height:1.5}
.enq-table tbody tr:last-child td{border-bottom:0}
.enq-table tbody tr:hover{background:var(--v2-paper-50)}
.enq-table th{background:var(--v2-paper-200);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--v2-brand-700)}
.enq-table td .hint{font-size:12px}
.enq-table a{color:var(--v2-brand-500);font-weight:500;text-decoration:none}
.enq-table a:hover{text-decoration:underline}
.enq-table .pill{margin:0 0 6px}
.enq-table select{width:auto;padding:7px 12px;font-size:13px;border-radius:999px}
.enq-table .small-btn{min-height:32px;padding:4px 12px;font-size:12px}
@media (max-width:860px){
  .admin-shell.is-active{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;background:var(--v2-paper-100)}
  .admin-sidebar{z-index:5;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;overflow:visible}
  .admin-brand{flex:0 0 auto;padding:0}
  .admin-brand img{width:96px}
  .admin-brand-tag,.admin-nav-label{display:none}
  .admin-nav{display:flex;flex:1;min-width:0;overflow-x:auto;gap:4px;scrollbar-width:none}
  .admin-nav button{white-space:nowrap;min-height:40px;padding:8px 12px}
  .admin-nav button svg{display:none}
  .admin-nav button.active::before{left:12px;right:12px;top:auto;bottom:2px;width:auto;height:3px;border-radius:3px}
  .admin-logout{margin:0;border:0;padding:8px;flex:0 0 auto}
  .admin-logout span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .admin-main{padding:22px 16px 48px}
  .admin-form{padding:20px 16px}
  .admin-item{grid-template-columns:52px minmax(0,1fr);padding:12px}
  .admin-item img,.admin-item .noimg{width:52px;height:52px}
  .admin-item .actions{grid-column:1/-1;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){.admin-btn,.admin-nav button,.admin-item{transition:none}.admin-btn:hover{transform:none}}
/* ---- Sign-in screen: form left, AARK arch right (arch on top on small screens) ---- */
#login-screen{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(24px,5vw,72px);padding:clamp(20px,4vw,56px) clamp(20px,6vw,96px);background:var(--v2-paper-100);font-family:var(--v2-font-body);color:var(--v2-ink-900)}
.login-card{width:min(400px,100%);justify-self:center;display:grid;gap:18px}
.login-card h1{font-family:var(--v2-font-display);font-weight:600;font-size:clamp(30px,3.2vw,40px);line-height:1.1;letter-spacing:-.01em;margin:0;text-align:center;color:var(--v2-ink-900)}
.login-lead{margin:-6px 0 6px;text-align:center;color:var(--v2-ink-500);font-size:15px}
.login-field{position:relative;display:flex;align-items:center;gap:10px;border:1.5px solid #d9cfe2;border-radius:16px;background:#fff;padding:0 14px;min-height:54px;transition:border-color .15s,box-shadow .15s}
.login-field:focus-within{border-color:var(--v2-brand-500);box-shadow:0 0 0 4px rgba(79,37,109,.12)}
.login-field-label{position:absolute;top:-10px;left:14px;padding:0 6px;background:var(--v2-paper-100);font-size:13px;font-weight:600;color:var(--v2-brand-700);line-height:18px}
.login-field svg{flex:0 0 18px;width:18px;height:18px;color:var(--v2-ink-500)}
.login-field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--v2-ink-900);padding:16px 0}
.login-field input::placeholder{color:#9a98a8}
.login-eye{flex:0 0 auto;display:grid;place-items:center;width:40px;height:40px;margin-right:-8px;border:0;border-radius:10px;background:none;color:var(--v2-ink-500);cursor:pointer}
.login-eye:hover,.login-eye:focus-visible{color:var(--v2-brand-500);background:var(--v2-paper-200)}
.login-eye:focus-visible,.login-submit:focus-visible,.login-back:focus-visible{outline:3px solid var(--v2-brand-500);outline-offset:2px}
.login-help{margin:-6px 0 0;text-align:right;font-size:13px;color:var(--v2-ink-700)}
.login-submit{margin-top:6px;min-height:52px;border:0;border-radius:999px;background:var(--v2-gold-500);color:var(--v2-ink-900);font:inherit;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 8px 20px rgba(250,200,3,.28);transition:transform .15s,box-shadow .15s}
.login-submit:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(250,200,3,.36)}
.login-submit:disabled{opacity:.6;cursor:wait;transform:none}
.login-or{display:flex;align-items:center;gap:12px;color:var(--v2-ink-500);font-size:12px;text-transform:lowercase}
.login-or::before,.login-or::after{content:"";flex:1;height:1px;background:#e2d9e8}
.login-back{justify-self:center;color:var(--v2-brand-500);font-weight:600;font-size:14px;text-decoration:none;padding:6px 4px}
.login-back:hover{text-decoration:underline}
#login-status{min-height:20px;margin:0;text-align:center;font-size:14px;font-weight:600;color:#b23b3b}
.login-arch{justify-self:center;position:relative;margin:0;width:min(440px,100%);aspect-ratio:4/5;border-radius:999px 999px 28px 28px;overflow:hidden;background:var(--v2-ink-900);box-shadow:var(--v2-shadow-soft)}
/* object-fit:cover makes any replacement photo fill the arch without stretching; faces sit a little above centre. */
.login-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.login-arch figcaption{position:absolute;left:0;right:0;bottom:0;display:grid;gap:2px;padding:56px 20px 18px;text-align:center;color:#fff;background:linear-gradient(to top,rgba(24,32,51,.92) 0%,rgba(24,32,51,.65) 55%,rgba(24,32,51,0) 100%)}
.login-arch figcaption strong{font-family:var(--v2-font-display);font-weight:600;font-size:18px}
.login-arch figcaption span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--v2-gold-500)}
@media (max-width:900px){
  #login-screen{grid-template-columns:1fr;align-content:start;padding-top:28px}
  .login-arch{order:-1;width:min(340px,86%);aspect-ratio:auto;height:250px;border-radius:999px 999px 24px 24px}
  .login-arch figcaption{padding:40px 16px 12px}
  .login-help{text-align:center}
}
@media (prefers-reduced-motion:reduce){.login-submit,.login-field{transition:none}.login-submit:hover{transform:none}}
</style></head><body>

<div id="login-screen">
  <form class="login-card" id="login-form">
    <h1>Welcome back</h1>
    <p class="login-lead">Sign in to manage enquiries and the school website.</p>
    <label class="login-field">
      <span class="login-field-label">Username</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <input name="username" autocomplete="username" placeholder="Enter your username" required>
    </label>
    <label class="login-field">
      <span class="login-field-label">Password</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
      <input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
      <button class="login-eye" type="button" data-toggle-password aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </label>
    <p class="login-help">Forgot your password? Contact the website administrator.</p>
    <button class="login-submit" type="submit">Sign in</button>
    <p class="admin-status err" id="login-status" role="alert"></p>
    <div class="login-or">or</div>
    <a class="login-back" href="index.html">&larr; Back to the school website</a>
  </form>
  <figure class="login-arch">
    <!-- To change this photo, replace assets/photos/admin-login.jpg (keep the name).
         Any size or shape works: it is cropped to fill the arch automatically. -->
    <img class="login-photo" src="assets/photos/admin-login.jpg" alt="Students smiling together" width="1200" height="803">
    <figcaption><strong>AARK International School</strong><span>Website admin</span></figcaption>
  </figure>
</div>

<div class="admin-shell" id="admin-shell">
  <aside class="admin-sidebar">
    <a class="admin-brand" href="index.html" aria-label="AARK International School website"><img src="assets/logo-full-on-dark.png" width="640" height="279" alt="AARK International School"></a>
    <p class="admin-brand-tag">Website admin</p>
    <nav class="admin-nav" id="admin-nav" aria-label="Admin sections">
      <p class="admin-nav-label">Admissions</p>
      <button data-tab="enquiries" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>Enquiries</button>
      <p class="admin-nav-label">Website content</p>
      <button data-tab="gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>Gallery</button>
      <button data-tab="staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.8-3.5 3.2-5.5 6-5.5s5.2 2 6 5.5"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.8c1.5.8 2.5 2.6 3 5.2"/></svg>Staff</button>
      <button data-tab="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l6 4V6L7 10H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>Popup Events</button>
      <button data-tab="schemes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12 12 20l-8-8V4h8z"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>Schemes</button>
      <button data-tab="fees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5h10M7 9h10M10 5c3.5 0 5 1.6 5 4s-1.5 4-5 4H7l7 6"/></svg>Fees</button>
      <p class="admin-nav-label">Safety</p>
      <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 4v4h4"/><path d="M12 8v4.5l3 2"/></svg>Content History</button>
    </nav>
    <button class="admin-logout" id="logout-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg><span>Sign out</span></button>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar"><span>AARK International School · Signed in</span><a href="index.html" target="_blank" rel="noopener">View website &#8599;</a></div>
    <div id="panel-enquiries" class="panel"></div>
    <div id="panel-gallery" class="panel" hidden></div>
    <div id="panel-staff" class="panel" hidden></div>
    <div id="panel-events" class="panel" hidden></div>
    <div id="panel-schemes" class="panel" hidden></div>
    <div id="panel-fees" class="panel" hidden></div>
    <div id="panel-history" class="panel" hidden></div>
  </main>
</div>

<script src="admin.js"></script>
</body></html>
